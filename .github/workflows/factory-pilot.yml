name: Factory pilot deployment contract
on:
  pull_request:
    paths:
      - deploy/factory/**
      - .github/workflows/factory-pilot.yml
  push:
    branches: [main]
    paths:
      - deploy/factory/**
      - .github/workflows/factory-pilot.yml
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y podman
          test -x /usr/libexec/podman/quadlet
          python3 -m venv /tmp/buzz-pilot-tests
          /tmp/buzz-pilot-tests/bin/pip install jinja2==3.1.6 PyYAML==6.0.3
          /tmp/buzz-pilot-tests/bin/python deploy/factory/test_pilot.py
