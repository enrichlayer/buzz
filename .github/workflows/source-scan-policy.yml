name: Source Scan Policy
on:
  pull_request:
  push:
    branches: [main, release]

permissions:
  contents: read

jobs:
  source-scan:
    name: Source scan and fixture controls
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install pinned scanner
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 90 \
            --output "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - name: Exercise source policy and negative controls
        run: |
          python3 scripts/test-source-scan-policy.py
          python3 scripts/check-source-scan-policy.py
