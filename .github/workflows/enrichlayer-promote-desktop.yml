name: Promote Enrich Layer Desktop Update
on:
  workflow_dispatch:
    inputs:
      version:
        description: Tested Enrich Layer version (X.Y.Z)
        required: true
        type: string
concurrency:
  group: enrichlayer-desktop-promotion
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  promote:
    if: github.repository == 'enrichlayer/buzz' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      pull-requests: read
      checks: read
      statuses: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Promote tested release and verify served manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          SOURCE_SHA=$(gh api "repos/enrichlayer/buzz/commits/el-desktop-v$VERSION" --jq .sha)
          python3 scripts/enrichlayer-release-gate.py check "$SOURCE_SHA"
          python3 scripts/enrichlayer-updater.py promote "$VERSION"
