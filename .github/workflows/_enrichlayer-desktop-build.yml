name: Enrich Layer macOS Release Build
on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      platform:
        required: true
        type: string
    outputs:
      artifact-prefix:
        description: Exact verified R2 artifact prefix from this successful build
        value: ${{ jobs.build.outputs.artifact-prefix }}
permissions:
  contents: read
jobs:
  build:
    if: github.repository == 'enrichlayer/buzz'
    runs-on: ${{ inputs.runner }}
    outputs:
      artifact-prefix: ${{ steps.upload.outputs.prefix }}
    timeout-minutes: 120
    env:
      BUZZ_UPDATER_ENDPOINT: https://buzz-downloads.enrichlayer.com/latest.json
      BUZZ_UPDATER_PUBLIC_KEY: ${{ secrets.BUZZ_UPDATER_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify source and signing prerequisites
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#el-desktop-v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          scripts/verify-release-ref.sh el-desktop-v "$VERSION"
          git merge-base --is-ancestor HEAD origin/main
          for key in BUZZ_UPDATER_PUBLIC_KEY TAURI_SIGNING_PRIVATE_KEY APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [[ -n "${!key}" ]] || { echo "::error::Missing $key"; exit 1; }
          done
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1
      - name: Install dependencies and set release version
        run: |
          just desktop-install-ci
          cd desktop
          node scripts/set-version-from-tag.mjs "$VERSION"
          node scripts/build-enrichlayer-release-config.mjs
          cd src-tauri
          cargo update --workspace
      - name: Build sidecars
        run: |
          cargo build --release -p buzz-acp -p buzz-agent -p buzz-backend-kubernetes -p buzz-dev-mcp -p git-credential-nostr -p buzz-cli
          scripts/bundle-sidecars.sh
      # Mesh rev derived from Cargo.lock (no lockstep edit on dep bump); cache key tracks it.
      - name: Resolve mesh-llm rev
        id: mesh_rev
        run: |
          set -euo pipefail
          REV=$(python3 -c 'import tomllib; d=tomllib.load(open("Cargo.lock", "rb")); p=next(p for p in d["package"] if p["name"] == "mesh-llm-sdk"); print(p["source"].rsplit("#", 1)[1])')
          [[ -n "$REV" ]] || { echo "::error::could not resolve mesh-llm rev from Cargo.lock"; exit 1; }
          echo "rev=$REV" >> "$GITHUB_OUTPUT"
          echo "short=${REV:0:7}" >> "$GITHUB_OUTPUT"
      - name: Restore mesh llama build cache
        id: llama_cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ github.workspace }}/.cache/mesh-llama
          key: mesh-llama-${{ inputs.platform }}-metal-${{ steps.mesh_rev.outputs.rev }}
      - name: Build mesh llama native libraries
        if: steps.llama_cache.outputs.cache-hit != 'true'
        env:
          MESH_REV_SHORT: ${{ steps.mesh_rev.outputs.short }}
        run: |
          set -euo pipefail
          cargo fetch --manifest-path desktop/src-tauri/Cargo.toml
          SHORT="$MESH_REV_SHORT"
          MESH_ROOT=$(find "${CARGO_HOME:-$HOME/.cargo}/git/checkouts" -path "*/$SHORT" -type d -name "$SHORT" | head -1)
          if [[ -z "$MESH_ROOT" ]]; then
            echo "::error::mesh-llm checkout for $SHORT not found after cargo fetch"
            exit 1
          fi
          export LLAMA_STAGE_BACKEND=metal
          export LLAMA_STAGE_BUILD_DIR="$GITHUB_WORKSPACE/.cache/mesh-llama/build-stage-abi-metal"
          export CMAKE_OSX_DEPLOYMENT_TARGET=10.15
          "$MESH_ROOT/scripts/prepare-llama.sh" pinned
          "$MESH_ROOT/scripts/build-llama.sh" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15
      - name: Save mesh llama build cache
        if: steps.llama_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ github.workspace }}/.cache/mesh-llama
          key: mesh-llama-${{ inputs.platform }}-metal-${{ steps.mesh_rev.outputs.rev }}

      - name: Build signed and notarized app
        working-directory: desktop
        run: pnpm tauri build --features mesh-llm --config src-tauri/tauri.release.conf.json
        env:
          CMAKE_POLICY_VERSION_MINIMUM: '3.5'
          MACOSX_DEPLOYMENT_TARGET: '10.15'
          CMAKE_OSX_DEPLOYMENT_TARGET: '10.15'
          LLAMA_STAGE_BACKEND: metal
          LLAMA_STAGE_BUILD_DIR: ${{ github.workspace }}/.cache/mesh-llama/build-stage-abi-metal
          SKIPPY_LLAMA_AUTO_BUILD: '0'
          TAURI_BUNDLER_DMG_IGNORE_CI: 'true'
      - name: Verify signatures and stage release assets
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          codesign --verify --deep --strict desktop/src-tauri/target/release/bundle/macos/Buzz.app
          xcrun stapler validate desktop/src-tauri/target/release/bundle/macos/Buzz.app
          mkdir -p staged
          cp desktop/src-tauri/target/release/bundle/macos/Buzz.app.tar.gz "staged/Buzz_${VERSION}_${PLATFORM}.app.tar.gz"
          cp desktop/src-tauri/target/release/bundle/macos/Buzz.app.tar.gz.sig "staged/Buzz_${VERSION}_${PLATFORM}.app.tar.gz.sig"
          cp desktop/src-tauri/target/release/bundle/dmg/*.dmg staged/
      - name: Upload verified build artifacts to private R2
        id: upload
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BUZZ_BUILD_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BUZZ_BUILD_R2_SECRET_ACCESS_KEY }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          python3 -m venv "$RUNNER_TEMP/buzz-r2"
          "$RUNNER_TEMP/buzz-r2/bin/pip" install -r scripts/buzz-r2-requirements.txt
          "$RUNNER_TEMP/buzz-r2/bin/python" scripts/buzz-r2.py upload-build "desktop/$GITHUB_SHA/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/$PLATFORM" staged
          echo "prefix=desktop/$GITHUB_SHA/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/$PLATFORM" >> "$GITHUB_OUTPUT"
