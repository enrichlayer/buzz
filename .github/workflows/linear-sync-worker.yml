name: Linear Sync Worker
on:
  pull_request:
    paths:
      - 'workers/linear-sync/**'
      - 'scripts/linear-*.mjs'
      - 'desktop/scripts/linear-*.test.mjs'
      - '.github/workflows/linear-sync-worker.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: linear-sync-worker-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: workers/linear-sync
      - run: node --test desktop/scripts/linear-project-snapshot.test.mjs desktop/scripts/linear-sync-outbox.test.mjs workers/linear-sync/worker.test.cjs workers/linear-sync/temporal.test.cjs
      - run: |
          python3 -m pip install Jinja2==3.1.6 PyYAML==6.0.3
          python3 workers/linear-sync/deploy.test.py
  image:
    needs: test
    if: github.repository == 'enrichlayer/buzz' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - name: Authenticate review image publishing
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build immutable candidate
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: .
          file: workers/linear-sync/Dockerfile
          push: true
          tags: ghcr.io/enrichlayer/buzz-linear-sync:review-${{ github.event.pull_request.head.sha || github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha || github.sha }}
            org.opencontainers.image.source=https://github.com/enrichlayer/buzz
          cache-from: type=gha,scope=linear-sync-worker
          cache-to: type=gha,scope=linear-sync-worker,mode=max
      - name: Record candidate identity
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          printf 'Source: `%s`\n\nCandidate: `ghcr.io/enrichlayer/buzz-linear-sync@%s`\n' "$SOURCE_SHA" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
