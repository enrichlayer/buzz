name: Sync central Buzz

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: enrichlayer-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'enrichlayer/buzz' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Optional fine-grained token for CI without approval of bot-created PRs.
      # It must NOT have the Workflows permission: workflow changes are never
      # pushed by this job (see ENRICHLAYER.md).
      GH_TOKEN: ${{ secrets.BUZZ_SYNC_TOKEN || github.token }}
      GH_REPO: enrichlayer/buzz
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.BUZZ_SYNC_TOKEN || github.token }}
      - name: Preserve the trusted sync script before merging upstream
        run: cp scripts/enrichlayer-upstream-sync.py "$RUNNER_TEMP/buzz-upstream-sync.py"
      - name: Prepare merge
        id: prepare
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 "$RUNNER_TEMP/buzz-upstream-sync.py" --result "$RUNNER_TEMP/buzz-sync.json"
      - name: Publish a draft for review
        id: publish
        if: steps.prepare.outputs.status == 'ready'
        run: |
          set -euo pipefail
          branch=codex/upstream-sync
          pr=$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr" ] && [ "$(jq -r .changed "$RUNNER_TEMP/buzz-sync.json")" = true ]; then
            draft=$(gh pr view "$pr" --json isDraft --jq .isDraft)
            if [ "$draft" = false ]; then gh pr ready "$pr" --undo; fi
            gh pr view "$pr" --json body --jq .body > "$RUNNER_TEMP/buzz-pr-body.md"
            if grep -q 'buzz-review-completed' "$RUNNER_TEMP/buzz-pr-body.md"; then
              sed -i 's/buzz-review-completed//g' "$RUNNER_TEMP/buzz-pr-body.md"
              gh pr edit "$pr" --body-file "$RUNNER_TEMP/buzz-pr-body.md"
            fi
          fi
          # No force: a concurrent maintainer fix causes a safe rejection.
          if ! git push origin "HEAD:refs/heads/$branch" 2> "$RUNNER_TEMP/buzz-push.err"; then
            cat "$RUNNER_TEMP/buzz-push.err" >&2
            # A token without workflow permission cannot push workflow changes
            # (for example main's own, merged into the branch); a maintainer must.
            if grep -qiE 'workflow.*(scope|permission)|refusing to allow .* to create or update workflow' "$RUNNER_TEMP/buzz-push.err"; then
              jq '.status = "needs-maintainer" | .reason = "push-rejected-workflow-files"' "$RUNNER_TEMP/buzz-sync.json" > "$RUNNER_TEMP/buzz-sync.next"
              mv "$RUNNER_TEMP/buzz-sync.next" "$RUNNER_TEMP/buzz-sync.json"
              echo 'status=needs-maintainer' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            exit 1
          fi
          if [ -z "$pr" ]; then
            cat > "$RUNNER_TEMP/buzz-pr-body.md" <<'BODY'
          Merge central Buzz into our fork while preserving our custom changes.

          This automated draft requires current-head CI, agent review, and human
          testing under AGENTS.md before readiness. With the default GITHUB_TOKEN,
          approve the workflow runs shown on this PR. This does not publish an app.

          Resolve any conflicts on `codex/upstream-sync`; the next run retains those
          commits. Source automation: DEV-12524; desktop releases: DEV-12467.
          BODY
            gh pr create --base main --head "$branch" --draft --title 'Merge central Buzz updates' --body-file "$RUNNER_TEMP/buzz-pr-body.md"
          fi
      - name: Record work that needs a maintainer
        if: steps.prepare.outputs.status == 'conflict' || steps.prepare.outputs.status == 'needs-maintainer' || steps.publish.outputs.status == 'needs-maintainer'
        run: |
          set -euo pipefail
          title='Resolve central Buzz sync conflicts'
          issue=$(gh issue list --state open --search "$title in:title" --json number,title,body --jq '.[] | select(.title == "Resolve central Buzz sync conflicts" and (.body | contains("<!-- buzz-upstream-sync -->"))) | .number' | head -1)
          {
            echo '<!-- buzz-upstream-sync -->'
            if [ "$(jq -r .status "$RUNNER_TEMP/buzz-sync.json")" = conflict ]; then
              echo 'Daily upstream synchronization needs a maintainer merge resolution.'
              echo 'Resolve on codex/upstream-sync, preserving fork changes, then rerun Sync central Buzz.'
            else
              echo 'Daily upstream synchronization changes .github/ (workflows or repository automation), so it was not pushed automatically.'
              echo 'A maintainer must review those changes, merge upstream locally and push codex/upstream-sync with their own credentials, then rerun Sync central Buzz.'
            fi
            echo
            # The script escapes backticks in this JSON, so the fence cannot be closed early.
            echo '```json'
            cat "$RUNNER_TEMP/buzz-sync.json"
            echo '```'
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "$RUNNER_TEMP/buzz-sync-conflict.md"
          if [ -n "$issue" ]; then
            gh issue edit "$issue" --body-file "$RUNNER_TEMP/buzz-sync-conflict.md"
          else
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/buzz-sync-conflict.md"
          fi
          exit 1
      - name: Close resolved sync conflict
        if: (steps.prepare.outputs.status == 'ready' && steps.publish.outputs.status != 'needs-maintainer') || steps.prepare.outputs.status == 'current'
        run: |
          set -euo pipefail
          issue=$(gh issue list --state open --search 'Resolve central Buzz sync conflicts in:title' --json number,title,body --jq '.[] | select(.title == "Resolve central Buzz sync conflicts" and (.body | contains("<!-- buzz-upstream-sync -->"))) | .number' | head -1)
          if [ -n "$issue" ]; then
            gh issue close "$issue" --comment 'The scheduled sync now merges cleanly or upstream is already included. CI, review, human acceptance and app release remain separate requirements.'
          fi
      - name: Show outcome
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/buzz-sync.json" ]; then
            cat "$RUNNER_TEMP/buzz-sync.json" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Synchronization failed before a merge result; inspect the failing step.' >> "$GITHUB_STEP_SUMMARY"
          fi
