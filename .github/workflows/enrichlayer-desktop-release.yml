name: Enrich Layer Desktop Release
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      publish:
        description: Publish only after main CI and existing review acceptance
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
  pull-requests: read
  checks: read
  statuses: read
concurrency:
  group: enrichlayer-release-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'enrichlayer/buzz'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate candidate identity
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.version }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python3 -c 'import re,os; assert re.fullmatch(r"[a-f0-9]{40}", os.environ["SOURCE_SHA"]); assert re.fullmatch(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", os.environ["VERSION"])'
      - name: Require reviewed main source and immutable tag
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.version }}
        run: |
          python3 scripts/enrichlayer-release-gate.py check "$SOURCE_SHA"
          GITHUB_REF="refs/tags/el-desktop-v$VERSION" scripts/verify-release-ref.sh el-desktop-v "$VERSION"
  arm64:
    needs: verify
    uses: ./.github/workflows/_enrichlayer-desktop-build.yml
    with:
      runner: macos-15
      platform: darwin-aarch64
      version: ${{ inputs.version }}
      source_sha: ${{ inputs.source_sha }}
      publish: ${{ inputs.publish }}
    secrets: inherit
  intel:
    needs: verify
    uses: ./.github/workflows/_enrichlayer-desktop-build.yml
    with:
      runner: macos-15-intel
      platform: darwin-x86_64
      version: ${{ inputs.version }}
      source_sha: ${{ inputs.source_sha }}
      publish: ${{ inputs.publish }}
    secrets: inherit
  linux:
    needs: verify
    outputs:
      artifact-prefix: ${{ steps.upload.outputs.prefix }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: ${{ inputs.publish && 'desktop-release' || 'desktop-candidate' }}
    env:
      VERSION: ${{ inputs.version }}
      BUZZ_UPDATER_ENDPOINT: https://buzz-downloads.enrichlayer.com/latest.json
      BUZZ_UPDATER_PUBLIC_KEY: ${{ secrets.BUZZ_UPDATER_PUBLIC_KEY }}
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Install Linux dependencies
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends build-essential desktop-file-utils file libasound2-dev libayatana-appindicator3-dev libgtk-3-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf pkg-config squashfs-tools xdg-utils
      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1
      - name: Install appimagetool
        run: |
          # Pin to an immutable release tag to avoid supply-chain drift from the
          # mutable `continuous` tag. Tag: 1.9.1, asset: appimagetool-<arch>.AppImage
          # (https://github.com/AppImage/appimagetool/releases/tag/1.9.1)
          case "$(uname -m)" in
            x86_64)  ARCH_SUFFIX="x86_64" ;;
            aarch64) ARCH_SUFFIX="aarch64" ;;
            *)
              echo "::error::Unsupported architecture: $(uname -m)"
              exit 1
              ;;
          esac
          wget -q --tries=3 --timeout=30 -O /tmp/appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-${ARCH_SUFFIX}.AppImage"
          # SHA256 integrity check. Refuse to run an unverified binary: if a new
          # arch (e.g. aarch64) is enabled in CI, compute its hash and add it here.
          if [[ "$ARCH_SUFFIX" == "x86_64" ]]; then
            echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  /tmp/appimagetool" | sha256sum -c
          else
            echo "::error::No pinned SHA256 for appimagetool-${ARCH_SUFFIX} — add it before enabling this architecture"
            exit 1
          fi
          sudo install -m 755 /tmp/appimagetool /usr/local/bin/appimagetool
          # appimagetool otherwise fetches the AppImage type2 runtime from the
          # MUTABLE `continuous` tag at repack time — the runtime is the first
          # code users execute, so pin it too. Tag: 20251108, hash is for the
          # x86_64 asset (non-x86_64 already hard-fails above).
          # (https://github.com/AppImage/type2-runtime/releases/tag/20251108)
          wget -q --tries=3 --timeout=30 -O /tmp/appimage-runtime \
            "https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-${ARCH_SUFFIX}"
          echo "2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  /tmp/appimage-runtime" | sha256sum -c
          sudo install -D -m 644 /tmp/appimage-runtime /usr/local/lib/appimage-runtime
          echo "APPIMAGETOOL_RUNTIME_FILE=/usr/local/lib/appimage-runtime" >> "$GITHUB_ENV"

      - name: Prepare Linux release build
        env:
          CMAKE_POLICY_VERSION_MINIMUM: '3.5'
        run: |
          just desktop-install-ci
          cd desktop
          node scripts/set-version-from-tag.mjs "$VERSION"
          node scripts/build-enrichlayer-release-config.mjs
          cd src-tauri && cargo update --workspace
          cd ../..
          cargo build --release -p buzz-acp -p buzz-agent -p buzz-backend-kubernetes -p buzz-dev-mcp -p git-credential-nostr -p buzz-cli
          scripts/bundle-sidecars.sh
      - name: Build Linux AppImage
        working-directory: desktop
        env:
          CMAKE_POLICY_VERSION_MINIMUM: '3.5'
          # The signing key is visible only to the Tauri bundler step.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --ci --bundles appimage --features mesh-llm --config src-tauri/tauri.release.conf.json
      - name: Repair and re-sign Linux AppImage
        env:
          # fix-appimage.sh repacks the AppImage and must re-sign it; without the
          # key it skips signing and the bundler's .sig no longer matches.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$TAURI_SIGNING_PRIVATE_KEY" ]] || { echo "::error::Missing TAURI_SIGNING_PRIVATE_KEY"; exit 1; }
          mapfile -t images < <(find desktop/src-tauri/target/release/bundle/appimage -name '*.AppImage' -type f)
          test "${#images[@]}" -eq 1
          bash desktop/scripts/fix-appimage.sh "${images[0]}"
      - name: Stage Linux updater artifact
        run: |
          set -euo pipefail
          mapfile -t images < <(find desktop/src-tauri/target/release/bundle/appimage -name '*.AppImage' -type f)
          test "${#images[@]}" -eq 1
          mkdir staged
          cp "${images[0]}" "staged/Buzz_${VERSION}_linux-x86_64.AppImage"
          cp "${images[0]}.sig" "staged/Buzz_${VERSION}_linux-x86_64.AppImage.sig"
      - name: Store verified build artifacts in private R2
        id: upload
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BUZZ_BUILD_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BUZZ_BUILD_R2_SECRET_ACCESS_KEY }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          PLATFORM: linux-x86_64
        run: |
          PREFIX="desktop/$SOURCE_SHA/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/$PLATFORM"
          bash scripts/run-buzz-r2.sh upload-build "$PREFIX" staged
          echo "prefix=$PREFIX" >> "$GITHUB_OUTPUT"
  windows:
    needs: verify
    outputs:
      artifact-prefix: ${{ steps.upload.outputs.prefix }}
    runs-on: windows-latest
    timeout-minutes: 120
    environment: ${{ inputs.publish && 'desktop-release' || 'desktop-candidate' }}
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ inputs.version }}
      TARGET: x86_64-pc-windows-msvc
      BUZZ_UPDATER_ENDPOINT: https://buzz-downloads.enrichlayer.com/latest.json
      BUZZ_UPDATER_PUBLIC_KEY: ${{ secrets.BUZZ_UPDATER_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ env.TARGET }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.5.2
      - name: Prepare Windows release build
        env:
          CMAKE_POLICY_VERSION_MINIMUM: '3.5'
        run: |
          pnpm install --frozen-lockfile
          cd desktop
          node scripts/set-version-from-tag.mjs "$VERSION"
          node scripts/build-enrichlayer-release-config.mjs
          cd src-tauri && cargo update --workspace
          cd ../..
          cargo build --release --target "$TARGET" -p buzz-acp -p buzz-agent -p buzz-dev-mcp -p git-credential-nostr -p buzz-cli
          scripts/bundle-sidecars.sh "$TARGET"
      - name: Build Windows installer
        working-directory: desktop
        env:
          CMAKE_POLICY_VERSION_MINIMUM: '3.5'
          # The signing key is visible only to the Tauri bundler step.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --ci --target "$TARGET" --bundles nsis --config src-tauri/tauri.release.conf.json
      - name: Stage Windows updater artifact
        run: |
          mapfile -t installers < <(find "desktop/src-tauri/target/$TARGET/release/bundle/nsis" -name '*.exe' -type f)
          test "${#installers[@]}" -eq 1
          mkdir staged
          cp "${installers[0]}" "staged/Buzz_${VERSION}_windows-x86_64-setup.exe"
          cp "${installers[0]}.sig" "staged/Buzz_${VERSION}_windows-x86_64-setup.exe.sig"
      - name: Store verified build artifacts in private R2
        id: upload
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BUZZ_BUILD_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BUZZ_BUILD_R2_SECRET_ACCESS_KEY }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          PLATFORM: windows-x86_64
        run: |
          PREFIX="desktop/$SOURCE_SHA/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/$PLATFORM"
          bash scripts/run-buzz-r2.sh upload-build "$PREFIX" staged
          echo "prefix=$PREFIX" >> "$GITHUB_OUTPUT"
  publish:
    if: inputs.publish
    needs: [arm64, intel, linux, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: desktop-release
    concurrency:
      group: enrichlayer-desktop-promotion
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
      pull-requests: read
      checks: read
      statuses: read
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Retrieve the successful build attempt for every platform
        env:
          BUILD_PREFIXES: ${{ toJSON(fromJSON(format('["{0}","{1}","{2}","{3}"]', needs.arm64.outputs.artifact-prefix, needs.intel.outputs.artifact-prefix, needs.linux.outputs.artifact-prefix, needs.windows.outputs.artifact-prefix))) }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BUZZ_BUILD_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BUZZ_BUILD_R2_SECRET_ACCESS_KEY }}
        run: bash scripts/run-buzz-r2.sh stage-release "$VERSION" staged
      - name: Recheck source and publish complete immutable R2 release
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BUZZ_RELEASE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BUZZ_RELEASE_R2_SECRET_ACCESS_KEY }}
        run: |
          python3 scripts/enrichlayer-release-gate.py check "$SOURCE_SHA"
          GITHUB_SHA="$SOURCE_SHA" bash scripts/run-buzz-r2.sh publish "$VERSION" staged
          python3 scripts/enrichlayer-publish.py "$VERSION" "$SOURCE_SHA"
          python3 scripts/enrichlayer-release-gate.py check "$SOURCE_SHA"
          bash scripts/run-buzz-r2.sh promote "$VERSION"
