name: Enrich Layer Desktop Release
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      source_sha:
        required: true
        type: string
permissions:
  contents: read
  actions: read
  pull-requests: read
  checks: read
  statuses: read
concurrency:
  group: enrichlayer-release-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require reviewed main source and immutable tag
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.version }}
        run: |
          python3 scripts/enrichlayer-release-gate.py check "$SOURCE_SHA"
          GITHUB_REF="refs/tags/el-desktop-v$VERSION" scripts/verify-release-ref.sh el-desktop-v "$VERSION"
  build:
    needs: verify
    if: github.repository == 'enrichlayer/buzz'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin-aarch64
          - runner: macos-15-intel
            platform: darwin-x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      BUZZ_UPDATER_ENDPOINT: https://github.com/enrichlayer/buzz/releases/download/buzz-desktop-latest/latest.json
      BUZZ_UPDATER_PUBLIC_KEY: ${{ secrets.BUZZ_UPDATER_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPLE_SIGNING_IDENTITY: '-'
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify source and signing prerequisites
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          GITHUB_REF="refs/tags/el-desktop-v$VERSION" scripts/verify-release-ref.sh el-desktop-v "$VERSION"
          python3 scripts/enrichlayer-release-gate.py check "$(git rev-parse HEAD)"
          git merge-base --is-ancestor HEAD origin/main
          for key in BUZZ_UPDATER_PUBLIC_KEY TAURI_SIGNING_PRIVATE_KEY; do
            [[ -n "${!key}" ]] || { echo "::error::Missing $key"; exit 1; }
          done
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1
      - name: Install dependencies and set release version
        run: |
          just desktop-install-ci
          cd desktop
          node scripts/set-version-from-tag.mjs "$VERSION"
          node scripts/build-enrichlayer-release-config.mjs
          cd src-tauri
          cargo update --workspace
      - name: Build sidecars
        run: |
          cargo build --release -p buzz-acp -p buzz-agent -p buzz-backend-kubernetes -p buzz-dev-mcp -p git-credential-nostr -p buzz-cli
          scripts/bundle-sidecars.sh
      # Mesh rev derived from Cargo.lock (no lockstep edit on dep bump); cache key tracks it.
      - name: Resolve mesh-llm rev
        id: mesh_rev
        run: |
          set -euo pipefail
          REV=$(python3 -c 'import tomllib; d=tomllib.load(open("Cargo.lock", "rb")); p=next(p for p in d["package"] if p["name"] == "mesh-llm-sdk"); print(p["source"].rsplit("#", 1)[1])')
          [[ -n "$REV" ]] || { echo "::error::could not resolve mesh-llm rev from Cargo.lock"; exit 1; }
          echo "rev=$REV" >> "$GITHUB_OUTPUT"
          echo "short=${REV:0:7}" >> "$GITHUB_OUTPUT"
      - name: Build mesh llama native libraries
        env:
          MESH_REV_SHORT: ${{ steps.mesh_rev.outputs.short }}
        run: |
          set -euo pipefail
          cargo fetch --manifest-path desktop/src-tauri/Cargo.toml
          SHORT="$MESH_REV_SHORT"
          MESH_ROOT=$(find "${CARGO_HOME:-$HOME/.cargo}/git/checkouts" -path "*/$SHORT" -type d -name "$SHORT" | head -1)
          if [[ -z "$MESH_ROOT" ]]; then
            echo "::error::mesh-llm checkout for $SHORT not found after cargo fetch"
            exit 1
          fi
          export LLAMA_STAGE_BACKEND=metal
          export LLAMA_STAGE_BUILD_DIR="$GITHUB_WORKSPACE/.cache/mesh-llama/build-stage-abi-metal"
          export CMAKE_OSX_DEPLOYMENT_TARGET=10.15
          "$MESH_ROOT/scripts/prepare-llama.sh" pinned
          "$MESH_ROOT/scripts/build-llama.sh" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15
      - name: Build ad-hoc signed Mac app
        working-directory: desktop
        run: pnpm tauri build --ci --features mesh-llm --config src-tauri/tauri.release.conf.json
        env:
          CMAKE_POLICY_VERSION_MINIMUM: '3.5'
          MACOSX_DEPLOYMENT_TARGET: '10.15'
          CMAKE_OSX_DEPLOYMENT_TARGET: '10.15'
          LLAMA_STAGE_BACKEND: metal
          LLAMA_STAGE_BUILD_DIR: ${{ github.workspace }}/.cache/mesh-llama/build-stage-abi-metal
          SKIPPY_LLAMA_AUTO_BUILD: '0'
          TAURI_BUNDLER_DMG_IGNORE_CI: 'true'
      - name: Verify ad-hoc signature and stage release assets
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          codesign --verify --deep --strict desktop/src-tauri/target/release/bundle/macos/Buzz.app
          mkdir -p staged
          cp desktop/src-tauri/target/release/bundle/macos/Buzz.app.tar.gz "staged/Buzz_${VERSION}_${PLATFORM}.app.tar.gz"
          cp desktop/src-tauri/target/release/bundle/macos/Buzz.app.tar.gz.sig "staged/Buzz_${VERSION}_${PLATFORM}.app.tar.gz.sig"
          cp desktop/src-tauri/target/release/bundle/dmg/*.dmg "staged/Buzz_${VERSION}_${PLATFORM}.dmg"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.platform }}
          path: staged/*
          if-no-files-found: error
  linux:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      VERSION: ${{ inputs.version }}
      BUZZ_UPDATER_ENDPOINT: https://github.com/enrichlayer/buzz/releases/download/buzz-desktop-latest/latest.json
      BUZZ_UPDATER_PUBLIC_KEY: ${{ secrets.BUZZ_UPDATER_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Install Linux dependencies
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends build-essential desktop-file-utils file libasound2-dev libayatana-appindicator3-dev libgtk-3-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf pkg-config squashfs-tools xdg-utils
      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1
      - name: Install appimagetool
        run: |
          # Pin to an immutable release tag to avoid supply-chain drift from the
          # mutable `continuous` tag. Tag: 1.9.1, asset: appimagetool-<arch>.AppImage
          # (https://github.com/AppImage/appimagetool/releases/tag/1.9.1)
          case "$(uname -m)" in
            x86_64)  ARCH_SUFFIX="x86_64" ;;
            aarch64) ARCH_SUFFIX="aarch64" ;;
            *)
              echo "::error::Unsupported architecture: $(uname -m)"
              exit 1
              ;;
          esac
          wget -q --tries=3 --timeout=30 -O /tmp/appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-${ARCH_SUFFIX}.AppImage"
          # SHA256 integrity check. Refuse to run an unverified binary: if a new
          # arch (e.g. aarch64) is enabled in CI, compute its hash and add it here.
          if [[ "$ARCH_SUFFIX" == "x86_64" ]]; then
            echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  /tmp/appimagetool" | sha256sum -c
          else
            echo "::error::No pinned SHA256 for appimagetool-${ARCH_SUFFIX} — add it before enabling this architecture"
            exit 1
          fi
          sudo install -m 755 /tmp/appimagetool /usr/local/bin/appimagetool
          # appimagetool otherwise fetches the AppImage type2 runtime from the
          # MUTABLE `continuous` tag at repack time — the runtime is the first
          # code users execute, so pin it too. Tag: 20251108, hash is for the
          # x86_64 asset (non-x86_64 already hard-fails above).
          # (https://github.com/AppImage/type2-runtime/releases/tag/20251108)
          wget -q --tries=3 --timeout=30 -O /tmp/appimage-runtime \
            "https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-${ARCH_SUFFIX}"
          echo "2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  /tmp/appimage-runtime" | sha256sum -c
          sudo install -D -m 644 /tmp/appimage-runtime /usr/local/lib/appimage-runtime
          echo "APPIMAGETOOL_RUNTIME_FILE=/usr/local/lib/appimage-runtime" >> "$GITHUB_ENV"

      - name: Prepare and build Linux AppImage
        env:
          CMAKE_POLICY_VERSION_MINIMUM: '3.5'
        run: |
          just desktop-install-ci
          cd desktop
          node scripts/set-version-from-tag.mjs "$VERSION"
          node scripts/build-enrichlayer-release-config.mjs
          cd src-tauri && cargo update --workspace
          cd ../..
          cargo build --release -p buzz-acp -p buzz-agent -p buzz-backend-kubernetes -p buzz-dev-mcp -p git-credential-nostr -p buzz-cli
          scripts/bundle-sidecars.sh
          cd desktop
          pnpm tauri build --ci --bundles appimage --features mesh-llm --config src-tauri/tauri.release.conf.json
      - name: Repair and stage Linux updater artifact
        run: |
          mapfile -t images < <(find desktop/src-tauri/target/release/bundle/appimage -name '*.AppImage' -type f)
          test "${#images[@]}" -eq 1
          bash desktop/scripts/fix-appimage.sh "${images[0]}"
          mkdir staged
          cp "${images[0]}" "staged/Buzz_${VERSION}_linux-x86_64.AppImage"
          cp "${images[0]}.sig" "staged/Buzz_${VERSION}_linux-x86_64.AppImage.sig"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-x86_64
          path: staged/*
          if-no-files-found: error
  windows:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ inputs.version }}
      TARGET: x86_64-pc-windows-msvc
      BUZZ_UPDATER_ENDPOINT: https://github.com/enrichlayer/buzz/releases/download/buzz-desktop-latest/latest.json
      BUZZ_UPDATER_PUBLIC_KEY: ${{ secrets.BUZZ_UPDATER_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ env.TARGET }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.4.0
      - name: Build Windows installer
        env:
          CMAKE_POLICY_VERSION_MINIMUM: '3.5'
        run: |
          pnpm install --frozen-lockfile
          cd desktop
          node scripts/set-version-from-tag.mjs "$VERSION"
          node scripts/build-enrichlayer-release-config.mjs
          cd src-tauri && cargo update --workspace
          cd ../..
          cargo build --release --target "$TARGET" -p buzz-acp -p buzz-agent -p buzz-dev-mcp -p git-credential-nostr -p buzz-cli
          scripts/bundle-sidecars.sh "$TARGET"
          cd desktop
          pnpm tauri build --ci --target "$TARGET" --bundles nsis --config src-tauri/tauri.release.conf.json
      - name: Stage Windows updater artifact
        run: |
          mapfile -t installers < <(find "desktop/src-tauri/target/$TARGET/release/bundle/nsis" -name '*.exe' -type f)
          test "${#installers[@]}" -eq 1
          mkdir staged
          cp "${installers[0]}" "staged/Buzz_${VERSION}_windows-x86_64-setup.exe"
          cp "${installers[0]}.sig" "staged/Buzz_${VERSION}_windows-x86_64-setup.exe.sig"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-x86_64
          path: staged/*
          if-no-files-found: error
  publish:
    needs: [build, linux, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: enrichlayer-desktop-promotion
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
      pull-requests: read
      checks: read
      statuses: read
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: '*-*64'
          path: staged
          merge-multiple: true
      - name: Recheck source, publish complete release, and promote
        run: |
          python3 scripts/enrichlayer-release-gate.py check "$SOURCE_SHA"
          python3 scripts/enrichlayer-publish.py "$VERSION" "$SOURCE_SHA" staged
          python3 scripts/enrichlayer-updater.py promote "$VERSION"
