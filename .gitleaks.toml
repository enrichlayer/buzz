# Exact reviewed nonsecret fixtures; see docs/security/source-scan-policy.md.
# Keep targetRules: global path allowlists skip files before content checks.
minVersion = "8.30.1"
[extend]
useDefault = true

[[allowlists]]
targetRules = ["generic-api-key"]
description = "public local development identity at Justfile"
condition = "AND"
regexTarget = "match"
paths = ['''(?:^|/)(?:tree/)?Justfile$''']
regexes = ['''(?s)^BUZZ_PRIVATE_KEY="3dbaebadb5dfd777ff25149ee230d907a15a9e1294b40b830661e65bb42f6c03"$''']

[[allowlists]]
targetRules = ["generic-api-key"]
description = "nonsecret dependency names at Cargo.lock"
condition = "AND"
regexTarget = "match"
paths = ['''(?:^|/)(?:tree/)?Cargo\.lock$''']
regexes = ['''(?s)^crypto_secretbox",\
\ "curve25519\-dalek\ $''']

