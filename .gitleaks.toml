\ \ \ \ \ \ \ \ \ \ \ \ "NPM_CONFIG_KEYFILE"\.to_string\(\),\
\ \ \ \ \ \ \ \ \ \ \ \ "/Users/dev/\.npm/client\.pem"\.to_string\(\),\
\ \ \ \ \ \ \ \ \),\
\ \ \ \ \]\);\
\
\ \ \ \ assert!\(secrets\.is_empty\(\),\ "got:\ \{secrets:\?\}"\);\
\}\
