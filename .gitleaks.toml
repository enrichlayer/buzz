\ \ \ \ \ \ \ \ \),\
\ \ \ \ \ \ \ \ \("GIT_AUTHOR_NAME"\.to_string\(\),\ "Ada\ Lovelace"\.to_string\(\)\),\
\ \ \ \ \ \ \ \ \(\
\ \ \ \ \ \ \ \ \ \ \ \ "KEYCHAIN"\.to_string\(\),\
